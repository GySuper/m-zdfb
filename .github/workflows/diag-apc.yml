name: Diagnose APC

# 排查"打包版被 APC 拦(伪装成上传超时)"。
# 源码 linux/windows + 冻结 windows 验签都已证明通过 → 疑点缩到:
#   (1) 注入烤入 apc_config 的 key 是否被弄坏  (2) 目标机本身
# 本 workflow:注入凭据 → 冻结 apc_diag.exe → CI 先用"烤入的 key"验一遍(查 1)→
# 把 exe 传成产物,下载到目标机跑(查 2,会打印被吞掉的 deny 真因)。
# 只在网页手动 Run workflow 时跑,不影响正常打包。
on:
  workflow_dispatch:

jobs:
  diag-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      APC_ENDPOINT:   ${{ secrets.APC_ENDPOINT }}
      APC_APP_ID:     ${{ secrets.APC_APP_ID }}
      APC_APP_SECRET: ${{ secrets.APC_APP_SECRET }}
      APC_PUBLIC_KEY: ${{ secrets.APC_PUBLIC_KEY }}
      APC_CERT_FP:    ${{ secrets.APC_CERT_FP }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: uv sync
        run: uv sync --all-extras

      - name: 注入 APC 凭据到 apc_config.py(同正式打包)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          @'
          import os, pathlib, sys
          for s in (sys.stdout, sys.stderr):
              try: s.reconfigure(encoding="utf-8", errors="replace")
              except Exception: pass
          p = pathlib.Path("wxsp/apc_config.py")
          content = p.read_text(encoding="utf-8")
          for key in ("APC_ENDPOINT","APC_APP_ID","APC_APP_SECRET","APC_PUBLIC_KEY","APC_CERT_FP"):
              val = os.environ.get(key)
              if val is None:
                  print(f"FATAL: env {key} 未设", file=sys.stderr); sys.exit(1)
              pat = f'"__{key}__"'
              if pat not in content:
                  print(f"FATAL: 占位符 {pat} 不在 apc_config.py", file=sys.stderr); sys.exit(1)
              content = content.replace(pat, repr(val))
          p.write_text(content, encoding="utf-8")
          print("注入完成")
          '@ | Out-File -Encoding utf8 build_inject.py
          uv run python build_inject.py
          if ($LASTEXITCODE -ne 0) { throw "注入失败" }

      - name: PyInstaller 冻结 apc_diag.exe
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          uv run --with pyinstaller pyinstaller --onefile --console `
            --collect-all apc_sdk --hidden-import wxsp.apc_config `
            --name apc_diag scripts/diag_apc.py

      - name: CI 先用"烤入的 key"验一遍(env 清空 → 走 baked)
        shell: pwsh
        env:
          APC_ENDPOINT: ""
          APC_APP_ID: ""
          APC_APP_SECRET: ""
          APC_PUBLIC_KEY: ""
          APC_CERT_FP: ""
        run: |
          $ErrorActionPreference = "Continue"
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          & .\dist\apc_diag.exe
          Write-Host "apc_diag exit=$LASTEXITCODE"
          exit 0

      - name: 上传 apc_diag.exe(下载到目标机跑)
        uses: actions/upload-artifact@v4
        with:
          name: apc_diag-exe
          path: dist/apc_diag.exe

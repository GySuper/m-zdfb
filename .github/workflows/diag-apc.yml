name: Diagnose APC

# 一次性诊断:用打包同一套 APC secrets 调后端 + 复刻客户端验签,
# 打印"到底哪把钥匙不对"。只在网页手动点 Run workflow 时跑,不影响正常打包。
# linux 与 windows 各跑一遍:对比二者的 ① 公钥自检 + VERDICT,
# 若 windows 失败而 linux 通过 = Windows 打包链把公钥弄坏了。
on:
  workflow_dispatch:

jobs:
  diag-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: uv sync
        run: uv sync --all-extras
      - name: Run APC diagnostic (linux)
        env:
          APC_ENDPOINT:   ${{ secrets.APC_ENDPOINT }}
          APC_APP_ID:     ${{ secrets.APC_APP_ID }}
          APC_APP_SECRET: ${{ secrets.APC_APP_SECRET }}
          APC_PUBLIC_KEY: ${{ secrets.APC_PUBLIC_KEY }}
          APC_CERT_FP:    ${{ secrets.APC_CERT_FP }}
        run: uv run python scripts/diag_apc.py

  diag-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: uv sync
        run: uv sync --all-extras
      - name: Run APC diagnostic (windows)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          APC_ENDPOINT:   ${{ secrets.APC_ENDPOINT }}
          APC_APP_ID:     ${{ secrets.APC_APP_ID }}
          APC_APP_SECRET: ${{ secrets.APC_APP_SECRET }}
          APC_PUBLIC_KEY: ${{ secrets.APC_PUBLIC_KEY }}
          APC_CERT_FP:    ${{ secrets.APC_CERT_FP }}
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          uv run python scripts/diag_apc.py

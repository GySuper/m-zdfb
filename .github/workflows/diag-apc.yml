name: Diagnose APC

# 一次性诊断:用打包同一套 APC secrets 调后端 + 复刻客户端验签,
# 打印"到底哪把钥匙不对"。只在网页手动点 Run workflow 时跑,不影响正常打包。
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: uv sync
        run: uv sync --all-extras

      - name: Run APC diagnostic
        env:
          APC_ENDPOINT:   ${{ secrets.APC_ENDPOINT }}
          APC_APP_ID:     ${{ secrets.APC_APP_ID }}
          APC_APP_SECRET: ${{ secrets.APC_APP_SECRET }}
          APC_PUBLIC_KEY: ${{ secrets.APC_PUBLIC_KEY }}
          APC_CERT_FP:    ${{ secrets.APC_CERT_FP }}
        run: uv run python scripts/diag_apc.py

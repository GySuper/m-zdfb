# ============== 全局 ==============
app:
  data_dir: ./data
  logs_dir: ./logs
  timezone: Asia/Shanghai

# ============== 路径(NAS 友好,跨平台) ==============
# 只配 NAS 挂载根目录;每个账号的 video/cover 检索路径在 accounts 下各自配。
# Windows 示例: nas_root: "Z:/wxsp" 或 "\\\\server\\share\\wxsp"
paths:
  nas_root: /Volumes/NAS/wxsp
  # 飞书"视频文件/封面文件"字段支持两种填法:
  #   1) 裸文件名 → 在账号 video_search_root / cover_search_root 下递归搜
  #   2) 完整 NAS 路径(UNC / POSIX) → 直接 Path.exists() 校验
  # 跨平台时,运营在 Windows 复制的 UNC 路径在 macOS 下需翻译成本地 mount 路径。
  # path_aliases 登记前缀对应关系;daemon 在 macOS 上把 key→value,在 Windows 上把 value→key。
  # 没有跨 OS 部署需求可留空 {} 或不填(等同禁用)。
  path_aliases: {}
  # 示例:
  # path_aliases:
  #   "\\\\172.31.15.11\\dianshang": "/Volumes/dianshang"
  #   "\\\\nas.local\\wxsp":         "/Volumes/wxsp"

# ============== 账号 ==============
# 每账号都要配 video_search_root / cover_search_root,可用 {nas_root} 占位
# user_data_dir 由 Web UI 添加账号时自动生成为 ./data/chrome-profiles/<id>
accounts:
  account_a:
    display_name: "美食号"
    enabled: true
    daily_limit: 20
    user_data_dir: ./data/chrome-profiles/account_a
    video_search_root: "{nas_root}/videos/account_a"
    cover_search_root: "{nas_root}/covers/account_a"
  account_b:
    display_name: "健身号"
    enabled: true
    daily_limit: 20
    user_data_dir: ./data/chrome-profiles/account_b
    video_search_root: "{nas_root}/videos/account_b"
    cover_search_root: "{nas_root}/covers/account_b"
  account_c:
    display_name: "旅游号"
    enabled: true
    daily_limit: 20
    user_data_dir: ./data/chrome-profiles/account_c
    video_search_root: "{nas_root}/videos/account_c"
    cover_search_root: "{nas_root}/covers/account_c"
  account_d:
    display_name: "搞笑号"
    enabled: true
    daily_limit: 20
    user_data_dir: ./data/chrome-profiles/account_d
    video_search_root: "{nas_root}/videos/account_d"
    cover_search_root: "{nas_root}/covers/account_d"

# ============== 调度 ==============
scheduler:
  enabled: true                       # false 时关闭每日 09:00 定时任务,daemon 仍启动,手动入口可用
  daily_cron_hour: 9
  daily_cron_minute: 0
  strategy: round-robin

# ============== 发布器 ==============
publisher:
  headless: false                # 视频号必须 false
  upload_timeout_seconds: 600
  step_pause_seconds: [1, 3]
  screenshot_on_error: true
  max_concurrent_accounts: 1

# ============== 飞书集成 ==============
feishu:
  enabled: true
  app_id: cli_xxxxxxxxxx
  app_secret: ${FEISHU_APP_SECRET}
  bitable:
    app_token: xxxxxxxxxxxx
    table_id: tblxxxxxxxx
  field_map:
    video_file: "视频文件"
    title: "标题"
    description: "描述"
    tags: "标签"
    cover: "封面文件"
    topic: "合集"
    original_claim: "原创"
    account: "账号"
    execute_date: "执行日期"
    publish_at: "定时发布时间"
    status: "状态"
    remote_url: "已发布链接"
    error_message: "错误信息"
  sync:
    write_back_enabled: true

# ============== 告警 + 归档(M9) ==============
monitoring:
  cookie_warn_days: 1.5
  notifiers:
    wecom:
      enabled: true
      webhook: ${WECOM_BOT_WEBHOOK}
  notify_on:
    - cookie_expired
    - cookie_warning
    - risk_control
    - task_failed
    - element_not_found
    - nas_unreachable
    - backlog_high
    - run_summary                     # 每日跑完一次的汇总(成功/失败计数 + 失败明细);attempted=0 不发
  # 启动时清旧文件用(spec §6.3)
  log_retention_days: 30
  screenshot_retention_days: 90
  # 历史积压(execute_date<today + pending/interrupted)超此数推 backlog_high 告警
  backlog_warn_threshold: 20

# ============== Web UI ==============
webui:
  host: 127.0.0.1
  port: 8765
  open_browser_on_start: true

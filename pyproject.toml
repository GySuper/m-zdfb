[project]
name = "wxsp"
dynamic = ["version"]
description = "微信视频号自动发布工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0",
    "loguru>=0.7.2",
    "sqlmodel>=0.0.21",
    "patchright>=1.40.0",
    "lark-oapi>=1.4.0",
    "apscheduler>=3.10.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "platformdirs>=4.0.0",
    "apc-sdk-python",
    "pyautogui>=0.9.54",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-pyyaml>=6.0.12",
    "httpx>=0.27.0",
    "trustme>=1.1.0",
    "pytest-httpserver>=1.0.0",
    "respx>=0.21.0",
]

[project.scripts]
wxsp = "wxsp.cli:app"

[tool.uv.sources]
apc-sdk-python = { path = "./apc_sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "wxsp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["wxsp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow assert False in tests
"wxsp/api/*" = ["B008"]  # FastAPI Depends() in argument defaults is the standard idiom

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false  # typer decorators are untyped
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "apc_sdk"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "apc_sdk.*"
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "integration: real browser + real account; run manually, skip in CI",
]

[dependency-groups]
dev = [
    "nuitka>=4.1",
    "pyinstaller>=6.20.0",
]

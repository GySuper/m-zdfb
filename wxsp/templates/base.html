<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}wxsp{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>
  <style>
    :root { --fg: #1a1a1a; --muted: #777; --bg: #fafafa; --card: #fff; --border: #e0e0e0; --primary: #0066cc; --warn: #d97706; --error: #dc2626; --ok: #16a34a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--fg); background: var(--bg); }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 24px; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    nav a { color: var(--fg); text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 14px; }
    nav a:hover { background: #f0f0f0; }
    nav a.active { background: var(--primary); color: #fff; }
    main { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin-bottom: 16px; }
    .card h2 { margin: 0 0 12px 0; font-size: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    th { background: #f5f5f5; font-weight: 600; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .badge.ok { background: #dcfce7; color: var(--ok); }
    .badge.warn { background: #fef3c7; color: var(--warn); }
    .badge.error { background: #fee2e2; color: var(--error); }
    .badge.muted { background: #f0f0f0; color: var(--muted); }
    button, .btn { display: inline-block; padding: 6px 14px; border: 1px solid var(--border); background: var(--card); color: var(--fg); border-radius: 4px; cursor: pointer; font-size: 13px; text-decoration: none; }
    button:hover, .btn:hover { background: #f0f0f0; }
    button.primary, .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.danger, .btn.danger { background: var(--error); color: #fff; border-color: var(--error); }
    .muted { color: var(--muted); font-size: 13px; }
    pre.log-stream { background: #1a1a1a; color: #e0e0e0; padding: 12px; border-radius: 4px; height: 480px; overflow-y: auto; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5; white-space: pre-wrap; }
    input[type=text], input[type=number], textarea, select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; font-family: inherit; }
    textarea { width: 100%; min-height: 200px; font-family: "SF Mono", Menlo, monospace; }
    .row { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
    .row > label { min-width: 140px; }
  </style>
</head>
<body>
  <header>
    <h1>wxsp · 视频号自动发布</h1>
    <nav>
      <a href="/" class="{% if active=='dashboard' %}active{% endif %}">总览</a>
      <a href="/accounts" class="{% if active=='accounts' %}active{% endif %}">账号</a>
      <a href="/tasks" class="{% if active=='tasks' %}active{% endif %}">任务</a>
      <a href="/plans" class="{% if active=='plans' %}active{% endif %}">计划</a>
      <a href="/logs" class="{% if active=='logs' %}active{% endif %}">日志</a>
      <a href="/config" class="{% if active=='config' %}active{% endif %}">配置</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

{% extends "setup/base.html" %}
{% block content %}
<h1>选择平台</h1>
<p>选择你要配置的发布平台。每个平台独立配置，后续可再加。</p>

<form method="post" action="/setup/step/1">
  <div class="form-row" style="margin-top: 20px;">
    <label>发布平台</label>
    <select name="platform" required style="width: 240px;">
      {% for p in platforms %}
        <option value="{{ p.key }}">{{ p.label }}</option>
      {% endfor %}
    </select>
    <span class="hint">每个平台独立配置文件，互不干扰</span>
  </div>

  <h2 style="font-size: 16px; margin-top: 28px;">环境自检</h2>
  <table>
    {% for c in self_check %}
    <tr>
      <td style="width: 30px;">{% if c.ok %}<span class="check-ok">✓</span>{% else %}<span class="check-fail">✗</span>{% endif %}</td>
      <td style="width: 180px;">{{ c.name }}</td>
      <td style="color: #777;">{{ c.detail }}</td>
    </tr>
    {% endfor %}
  </table>

  <p class="step-label" style="margin-top: 20px;">配置和数据将写入: <code>{{ data_dir }}</code></p>

  <div class="actions">
    <button type="submit" class="primary"
      {% if self_check|selectattr('ok', 'equalto', false)|list %}disabled{% endif %}>
      下一步:飞书配置 →
    </button>
  </div>
</form>
{% endblock %}
